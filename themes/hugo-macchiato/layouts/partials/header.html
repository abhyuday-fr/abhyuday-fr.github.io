{{ $user := .Site.Params.prompt.user | default "guest" }}
{{ $host := .Site.Params.prompt.host | default "blog" }}
{{ $path := .Site.Params.prompt.path | default "~" }}
<header class="site-header">
  <div class="wrap{{ if .Site.Params.wideLayout }} wrap--wide{{ end }} site-header__inner">
    <a href="{{ " /" | relLangURL }}" class="brand" aria-label="{{ .Site.Title }} — home">
      <span class="brand__user">{{ $user }}</span><span class="brand__at">@</span><span class="brand__host">{{ $host
        }}</span><span class="brand__sep">:</span><span class="brand__path">{{ $path }}</span><span
        class="brand__sep">$</span>
      <span class="brand__cursor">&nbsp;</span>
    </a>

    <div style="display:flex; align-items:center; gap:0.6rem;">
      <nav id="site-nav" class="nav" aria-label="Primary">
        {{ range .Site.Menus.main }}
        <a href="{{ .URL | relLangURL }}" {{ if $.IsMenuCurrent "main" . }} aria-current="page" {{ end }}>{{ .Name
          }}</a>
        {{ end }}
      </nav>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle color theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 1020.354 15.354z" />
        </svg>
      </button>
      <button id="nav-toggle" class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false"
        aria-controls="site-nav">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      </button>
    </div>
  </div>
</header>
