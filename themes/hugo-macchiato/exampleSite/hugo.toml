baseURL = "https://example.com/"
languageCode = "en-us"
title = "Lawless // stderr"
theme = "macchiato"

paginate = 6
enableRobotsTXT = true

[params]
  author = "Lawless"
  description = "Notes on C++, systems programming, and things I broke and fixed."
  tagline = "Notes from the terminal."
  favicon = "favicon.svg"
  wideLayout = false

  [params.prompt]
    user = "lawless"
    host = "stderr"
    path = "~/blog"

  [params.social]
    github = "https://github.com/abhyuday-fr"

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 2
  [[menu.main]]
    name = "Tags"
    url = "/tags/"
    weight = 3
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 4

  [[menu.footer]]
    name = "Home"
    url = "/"
    weight = 1

[markup]
  [markup.highlight]
    noClasses = false
    lineNos = false
    style = "monokai"
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

